# DataSource H2
spring.datasource.url=jdbc:h2:mem:queuelive_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Sobrescreve as variaveis de ambiente do Keycloak
KEYCLOAK_URL=http://localhost:9999
KEYCLOAK_REALM=test

# Usa jwk-set-uri para evitar o OIDC discovery
spring.security.oauth2.resourceserver.jwt.issuer-uri=
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9999/realms/test/protocol/openid-connect/certs